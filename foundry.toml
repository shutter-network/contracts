[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"

extra_output = ['devdoc', 'userdoc', 'metadata', 'storageLayout']
bytecode_hash = 'none'
build_info = true

ffi = true
ast = true
fs_permissions = [{ access = "read", path = "out" }]

[rpc_endpoints]
hardhat = "${HARDHAT_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
